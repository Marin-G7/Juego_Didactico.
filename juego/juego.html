<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahorcado Educativo - Jugar</title>
  <link rel="stylesheet" href="../estilos-generales.css">
  <link rel="stylesheet" href="juego.css">
</head>
<body>

  <header class="menu-principal">
    <span class="logo">Ahorcado Educativo</span>
    <nav>
      <a href="../index.html">Inicio</a>
      <a href="juego.html">Jugar</a>
      <a href="../resultados/resultados.html">Resultados</a>
      <a href="../categorias/categorias.html">Categorías</a>
    </nav>
  </header>

  <main>
    <h1>Adivina la palabra</h1>

    <section class="tarjeta-juego">

      <div class="zona-dibujo">
        <svg viewBox="0 0 200 200" class="dibujo-ahorcado">
          <line x1="20" y1="180" x2="120" y2="180" stroke="#22223b" stroke-width="6" stroke-linecap="round"/>
          <line x1="50" y1="180" x2="50" y2="20" stroke="#22223b" stroke-width="6" stroke-linecap="round"/>
          <line x1="50" y1="20" x2="130" y2="20" stroke="#22223b" stroke-width="6" stroke-linecap="round"/>
          <line x1="130" y1="20" x2="130" y2="45" stroke="#22223b" stroke-width="4"/>

          <circle id="parte-cabeza" cx="130" cy="60" r="15" stroke="#ef476f" stroke-width="5" fill="none" opacity="0"/>
          <line id="parte-torso" x1="130" y1="75" x2="130" y2="120" stroke="#ef476f" stroke-width="5" opacity="0"/>
          <line id="parte-brazo-izq" x1="130" y1="85" x2="110" y2="105" stroke="#ef476f" stroke-width="5" stroke-linecap="round" opacity="0"/>
          <line id="parte-brazo-der" x1="130" y1="85" x2="150" y2="105" stroke="#ef476f" stroke-width="5" stroke-linecap="round" opacity="0"/>
          <line id="parte-pierna-izq" x1="130" y1="120" x2="112" y2="150" stroke="#ef476f" stroke-width="5" stroke-linecap="round" opacity="0"/>
          <line id="parte-pierna-der" x1="130" y1="120" x2="148" y2="150" stroke="#ef476f" stroke-width="5" stroke-linecap="round" opacity="0"/>
        </svg>
      </div>

      <div class="zona-palabra">
        <p class="categoria-actual">Categoría: <strong id="categoria-juego">-</strong></p>
        <p id="palabra-oculta">_ _ _ _ _</p>
        <p id="mensaje-estado"></p>
        <p id="intentos-restantes">Intentos restantes: <strong id="numero-intentos">6</strong></p>

        <a href="../resultados/resultados.html" id="btn-ver-resultado" class="boton boton-verde oculto">Ver resultado</a>
      </div>

    </section>

    <div id="teclado-letras">
      <button data-letra="A">A</button>
      <button data-letra="B">B</button>
      <button data-letra="C">C</button>
      <button data-letra="D">D</button>
      <button data-letra="E">E</button>
      <button data-letra="F">F</button>
      <button data-letra="G">G</button>
      <button data-letra="H">H</button>
      <button data-letra="I">I</button>
      <button data-letra="J">J</button>
      <button data-letra="K">K</button>
      <button data-letra="L">L</button>
      <button data-letra="M">M</button>
      <button data-letra="N">N</button>
      <button data-letra="Ñ">Ñ</button>
      <button data-letra="O">O</button>
      <button data-letra="P">P</button>
      <button data-letra="Q">Q</button>
      <button data-letra="R">R</button>
      <button data-letra="S">S</button>
      <button data-letra="T">T</button>
      <button data-letra="U">U</button>
      <button data-letra="V">V</button>
      <button data-letra="W">W</button>
      <button data-letra="X">X</button>
      <button data-letra="Y">Y</button>
      <button data-letra="Z">Z</button>
    </div>

    <script src="juego.js"></script>
  </main>

  <footer class="pie-pagina">
    Proyecto de Programación en la Web
  </footer>

</body>
</html>
